<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess a nmber</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Guess the number</h1>
     <hr>
    <div class="container">

        <div class="game-instructions">
             <p>I'm thinking of a number between 0 and 100. Can you guess it?</p>
          <p>You have <span id="remainingGuesses">10</span> guesses remaining.</p>
        </div>
           
        
            <div class="formgroup">
            <label class="formlabel" for="guessNumber">Your guesses(0-100):</label>
            <br>
            <input class="forminput" type="number" name="guesses" id="guessNumber" 
            placeholder="Enter your Number" max="100" min="0">
        </div>
        <div class="help"><p>Enter a number between 0 and 100</p></div>
        <div class="button-group">
            <button id="submit" style="background-color: #0d6efd;">Submit Guesses</button>
            <button id="new-game" style="background-color: #0d6efd;" disabled>New Game</button>
        </div>
        
        <div class="feedback">
         <output id="output"></output>
         <br>
        <output id="guess-display" class="guesses"></output>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
