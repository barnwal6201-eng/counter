<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather App</h1>
    <hr>

    <div class="container">
        <h2 class="heading">CHECK THE WEATHER!!</h2>

        <form class="search">
            <input type="text" name="searchcity" id="userinput-city" placeholder="Enter city name">
            <button>
             <img id="search-button" src="https://static.vecteezy.com/system/resources/thumbnails/009/652/218/small/magnifying-glass-icon-isolated-on-white-background-search-illustration-vector.jpg"
              alt="search-image" style="height: 28px;">
            </button>
        </form>
    </div>
    <button class="reset" id="reset">Reset</button>
     <div class="error">
            <p>INVALID CITY NAME!!</p>
        </div>
        <div class="weatherOutput">
           <div id="city-name"></div>
           <div id="temperature"></div>
           <div id="humidity"></div>
        </div>

    <script src="index.js"></script>
</body>
</html>
