<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
        body{
            margin: 0;
            height: 44vh;
            width: 200vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .container{
            text-align: center;
            height: 50%;
            width: 27%;
        }

        h2{
            text-align: center;
        }
        .time{
             background-color: rgb(185, 181, 181);
            color: blue;
            border-radius: 8px;
            font-family: sans-serif;
        }

    </style>
</head>
<body>
    <div class="container">
    <h2>STOPWATCH</h2>
    <hr>
    <div class="time">
    <h2 id="displayTiming">00:00:00</h2>
    </div>

    <div class="btns">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="resetBtn">Reset</button>
    </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
