<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>String Transforms</h1>
    <hr>
    <div class="container">
    <div>
    <input class="user-input" type="text" name="input-sentences" id="input-sentences"
     placeholder="Type something to transform......">
    </div>
    
    <p>Type any text to see it transformed in different formats below</p>

    <div class="transformers">
        <div class="transformer-item">
            <span class="transformer-label">LOWER CASE</span>
            <output class="transformer-output" id="lower-case"></output>
        </div>

        <div class="transformer-item">
            <span class="transformer-label">UPPER CASE</span>
            <output class="transformer-output" id="upper-case"></output>
        </div>

        <div class="transformer-item">
            <span class="transformer-label">CAMEL CASE</span>
            <output class="transformer-output" id="camel-case"></output>
        </div>

        <div class="transformer-item">
            <span class="transformer-label">SNAKE CASE</span>
            <output class="transformer-output" id="snake-case"></output>
        </div>

        <div class="transformer-item">
            <span class="transformer-label">PASCAL CASE</span>
            <output class="transformer-output" id="pascal-case"></output>
        </div>

        <div class="transformer-item">
            <span class="transformer-label">KEBAB CASE</span>
            <output class="transformer-output" id="kebab-case"></output>
        </div>
    </div>

     </div>
    <script src="index.js"></script>
</body>
</html>
