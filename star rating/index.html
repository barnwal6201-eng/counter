<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
        }
        .container{
            display: flex;
            justify-content: center;
            height: 100vh;
            gap: 8px;
            margin-top: 34px;
        }
        .circle{
            width: 50px;
            height: 50px;
            border: 4px solid black;
            border-radius: 50%;
        }
        .setRating{
            text-align: center;
            display: block;
            margin: 83px 25px 1px -315px;
        }
        .emojiContainer{
             text-align: center;
            display: block;
            margin: 130px 65px 27px -285px;
        }
        .ratings{
            font-size: larger;
            display: none
        }
    </style>
</head>
<body>
    <h1>Star Rating</h1>
    <hr>
    <div class="container" id="circle-container">
    <button id="circle1" class="circle"></button>
    <button id="circle2" class="circle"></button>
    <button id="circle3" class="circle"></button>
    <button id="circle4" class="circle"></button>
    <button id="circle5" class="circle"></button>
     <div class="setRating"><p>
        click to set the ratings
        And double click to remove.
     </p></div>
     <div class="emojiContainer">
        <div id="verybad" class="ratings" style="color: black;">VERY-BAD</div>
        <div id="bad" class="ratings" style="color: blue;">BAD</div>
        <div id="good" class="ratings" style="color: brown;">GOOD</div>
        <div id="verygood" class="ratings" style="color: red;">VERY-GOOD</div>
        <div id="excellent" class="ratings" style="color: green;">EXCELLENT</div>
    </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
